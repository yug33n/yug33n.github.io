<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Plate -->
  <rect width="64" height="64" rx="14" fill="#0b0d13" />
  <!-- Neon Accent Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Terminal Prompt: > -->
  <path d="M18 20L32 32L18 44" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Cursor: _ -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
</svg>